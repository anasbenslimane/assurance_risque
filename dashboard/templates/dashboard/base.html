<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Assurance Risque{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fb;
            font-family:"Segoe UI",sans-serif;
        }

        .nav-link{
            color:white !important;
            border-radius:10px;
            padding:10px 12px;
            transition:.25s;
        }

        .nav-link:hover{
            background:rgba(255,255,255,.15);
            padding-left:18px;
        }

        .sidebar{
    position: fixed;
    top: 0;
    left: 0;

    width: 260px;
    height: 100vh;

    overflow-y: auto;

    background: linear-gradient(180deg,#0d6efd,#1e3c72);
    color: white;
    padding: 30px;
    box-shadow: 4px 0 20px rgba(0,0,0,.15);
    z-index: 1000;
}

        .content{
    margin-left: 260px;
    width: calc(100% - 260px);
    padding: 30px;
    min-height: 100vh;
}

        .btn-light{
            border-radius:12px;
            font-weight:600;
        }

        .logout-btn{
    width:90%;
    border:none;
    border-radius:14px;
    padding:12px;
    background:white;
    color:#1f2937;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.logout-btn:hover{
    background:#f3f4f6;
}

    </style>

</head>

<body>

    <!-- Sidebar fixe -->

    <div class="sidebar">

        <h3 class="mb-5">
            <i class="bi bi-shield-check"></i>
            Assurance Auto Anas
        </h3>

        <div class="nav flex-column">

            

            {% if user.is_authenticated %}

            <a class="nav-link text-white mb-2" href="{% url 'dashboard' %}">
                <i class="bi bi-grid me-2"></i>
                Tableau de bord
            </a>

            <a class="nav-link text-white mb-2" href="{% url 'analysis' %}">
                <i class="bi bi-bar-chart-line me-2"></i>
                Analyse
            </a>

            <a class="nav-link text-white mb-2" href="{% url 'prediction' %}">
                <i class="bi bi-robot me-2"></i>
                Prédiction
            </a>

            <a class="nav-link text-white mb-2" href="{% url 'history' %}">
                <i class="bi bi-clock-history me-2"></i>
                Historique
            </a>

            <hr class="text-white">

            <!-- Avatar Agent -->

            <div class="d-flex align-items-center mt-3 mb-3">

                <div class="position-relative me-3">

                    <div class="rounded-circle bg-white d-flex align-items-center justify-content-center"
                         style="width:55px;height:55px;">

                        <i class="bi bi-person-fill text-primary fs-3"></i>

                    </div>

                    <span class="position-absolute bottom-0 end-0 bg-success border border-white rounded-circle"
                          style="width:14px;height:14px;"></span>

                </div>

                <div>

                    <small class="text-light d-block">Agent connecté</small>

                    <strong>{{ user.username }}</strong>

                    <small class="text-success d-block">● En ligne</small>

                </div>

            </div>

            <form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit" class="logout-btn">
        <i class="bi bi-box-arrow-right me-2"></i>
        Déconnexion
    </button>
</form>

            {% else %}

            <a class="btn btn-light mt-3 w-100" href="{% url 'login' %}">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Connexion
            </a>

            {% endif %}

        </div>

    </div>

    <!-- Contenu -->

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
