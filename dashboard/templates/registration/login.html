{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Assurance Risque</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#0d6efd,#1e3c72);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        }

        .login-card{
            width:420px;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(18px);
            border-radius:20px;
            padding:40px;
            color:white;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        .logo-circle{
            width:80px;
            height:80px;
            background:white;
            color:#0d6efd;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:36px;
            margin:auto;
            margin-bottom:20px;
        }

        .form-control{
            background:rgba(255,255,255,.9);
            border:none;
            border-radius:12px;
            height:48px;
        }

        .btn-login{
            border-radius:12px;
            height:48px;
            font-weight:bold;
        }

        .input-group-text{
            border:none;
            background:white;
            border-radius:12px 0 0 12px;
        }

        .footer-text{
            font-size:.9rem;
            color:#e8e8e8;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo-circle">
        <i class="bi bi-shield-check"></i>
    </div>

    <h2 class="text-center fw-bold">Assurance Risque</h2>

    <p class="text-center footer-text mb-4">
        Plateforme intelligente de prédiction des risques
    </p>

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">Nom d'utilisateur</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Entrez votre nom d'utilisateur"
                    required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">Mot de passe</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Entrez votre mot de passe"
                    required>

            </div>

        </div>

        <button class="btn btn-light btn-login w-100 text-primary">
            <i class="bi bi-box-arrow-in-right"></i>
            Se connecter
        </button>

    </form>

    {% if form.errors %}
        <div class="alert alert-danger mt-3">
            Nom d'utilisateur ou mot de passe incorrect.
        </div>
    {% endif %}

    <div class="text-center mt-4 footer-text">
        WAFA Assurance • Projet de stage 2026
    </div>

</div>

</body>
</html>
